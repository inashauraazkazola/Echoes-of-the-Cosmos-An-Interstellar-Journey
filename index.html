        function stopSpeech() {
          speechGeneration += 1;
          if (speechTimerId !== null) {
            clearTimeout(speechTimerId);
            speechTimerId = null;
          }
          if (wordTimerId !== null) {
            clearTimeout(wordTimerId);
            wordTimerId = null;
          }
          clearAllSpeechHighlights();
          if (hasSpeechSupport) {
            window.speechSynthesis.cancel();
          }
        }

        function buildScreenSpeechSegments(screen) {
          if (screen.type === 'landing') {
            return [
              {
                speaker: 'Narrator',
                text: 'Echoes of the Cosmos: An Interstellar Journey. Welcome, young explorers! Join Emi the chubby little orange fox, and Otty the friendly brown sea otter, on an interstellar voyage to the Moon and Mars.'
              }
            ];
          }
          if (screen.type === 'chapter-intro') {
            return [
              {
                speaker: 'Narrator',
                text: `${screen.title}. ${screen.subtitle}`
              }
            ];
          }
          if (screen.type === 'panel') {
            const segments = [];
            if (screen.narrator) {
              segments.push({ speaker: 'Narrator', blockId: 'narrator', containerId: 'narrator', text: screen.narrator });
            }
            if (screen.dialogue && screen.dialogue.length > 0) {
              screen.dialogue.forEach((line, idx) => {
                segments.push({
                  speaker: line.speaker,
                  blockId: `dialogue-${idx}`,
                  containerId: `dialogue-${idx}`,
                  text: line.text
                });
              });
            }
            return segments;
          }
          if (screen.type === 'explorer-challenge') {
            return [
              {
                speaker: 'Narrator',
                text: 'Explorer Challenge! Check the NASA artifacts you discovered on your journey and answer the Space Explorer Mini Quiz!'
              }
            ];
          }
          if (screen.type === 'outro') {
            return [
              {
                speaker: 'Narrator',
                text: "Mission Complete! Thank you for joining Emi and Otty on this unforgettable journey through NASA's stellar history!"
              }
            ];
          }
          return [];
        }

        function playSpeechSegments(segments, forceSpeak) {
          if (!hasSpeechSupport) return;
          stopSpeech();
          if ((!autoVoiceEnabled && !forceSpeak) || !audioUnlocked || !segments.length) return;

          const melodicQueue = expandSegmentsWithProsody(segments);
          if (!melodicQueue.length) return;

          const activeGeneration = speechGeneration;
          let index = 0;

          function speakNext() {
            if (activeGeneration !== speechGeneration || (!autoVoiceEnabled && !forceSpeak) || index >= melodicQueue.length) {
              return;
            }

            const item = melodicQueue[index];
            index += 1;

            if (item.isSpeakerStart && (item.speaker !== 'Narrator' || item.isFirstOfScreen)) {
              playStoryChime(item.speaker, forceSpeak);
            }

            setActiveSpeakerContainer(item.containerId);

            const spokenText = item.text
              .replace(/\.\.\./g, ',')
              .replace(/\bEmi\b/gi, 'Emmy');
            const profile = getSpeechProfile(item.speaker);
            const utterance = new SpeechSynthesisUtterance(spokenText);
            if (profile.voice) {
              utterance.voice = profile.voice;
            }

            const scaledOffset = item.speaker === 'Emi' ? item.pitchOffset * 0.5 : item.pitchOffset;
            const maxPitch = profile.isChildVoice ? 1.22 : 1.37;
            const effectiveRate = clampNum((profile.rate + item.rateOffset) * speechRateMultiplier, 0.72, 1.25);
            utterance.rate = effectiveRate;
            utterance.pitch = clampNum(profile.pitch + scaledOffset, 0.85, maxPitch);
            utterance.volume = profile.volume;

            const spokenWords = spokenText.split(/\s+/).filter(Boolean);
            const wordRanges = [];
            let charPos = 0;
            spokenWords.forEach((w, wIdx) => {
              const start = spokenText.indexOf(w, charPos);
              const end = start + w.length;
              wordRanges.push({
                wordIndex: item.wordStart + wIdx,
                start,
                end,
                durationMs: Math.round((Math.max(2.6, w.length + (/[,.!?]/.test(w) ? 2.8 : 0.4)) * 54) / effectiveRate)
              });
              charPos = end;
            });

            let usedBoundary = false;

            function scheduleFallbackWord(stepIdx) {
              if (
                activeGeneration !== speechGeneration ||
                usedBoundary ||
                !item.blockId ||
                stepIdx >= wordRanges.length
              ) {
                return;
              }
              setActiveWord(item.blockId, wordRanges[stepIdx].wordIndex);
              if (stepIdx + 1 < wordRanges.length) {
                wordTimerId = setTimeout(() => {
                  scheduleFallbackWord(stepIdx + 1);
                }, wordRanges[stepIdx].durationMs);
              }
            }

            utterance.onstart = () => {
              if (activeGeneration !== speechGeneration) return;
              if (item.blockId && wordRanges.length > 0) {
                scheduleFallbackWord(0);
              }
            };

            utterance.onboundary = (event) => {
              if (activeGeneration !== speechGeneration || !item.blockId) return;
              if (typeof event.charIndex === 'number' && (!event.name || event.name === 'word')) {
                usedBoundary = true;
                if (wordTimerId !== null) {
                  clearTimeout(wordTimerId);
                  wordTimerId = null;
                }
                const match =
                  wordRanges.find((r) => event.charIndex < r.end) ||
                  wordRanges[wordRanges.length - 1];
                if (match) {
                  setActiveWord(item.blockId, match.wordIndex);
                }
              }
            };

            utterance.onend = () => {
              if (wordTimerId !== null) {
                clearTimeout(wordTimerId);
                wordTimerId = null;
              }
              if (activeGeneration !== speechGeneration) return;
              if (item.blockId && item.wordCount > 0) {
                markBlockPhraseSpoken(item.blockId, item.wordStart + item.wordCount - 1);
              }
              if (index < melodicQueue.length) {
                speechTimerId = setTimeout(speakNext, item.pauseAfter);
              } else {
                speechTimerId = setTimeout(() => {
                  if (activeGeneration === speechGeneration) {
                    clearAllSpeechHighlights();
                  }
                }, 380);
              }
            };

            utterance.onerror = () => {
              if (wordTimerId !== null) {
                clearTimeout(wordTimerId);
                wordTimerId = null;
              }
              if (activeGeneration !== speechGeneration) return;
              if (index < melodicQueue.length) {
                speechTimerId = setTimeout(speakNext, 90);
              } else {
                clearAllSpeechHighlights();
              }
            };

            window.speechSynthesis.speak(utterance);
          }

          speakNext();
        }

        function speakScreen(screen) {
          playSpeechSegments(buildScreenSpeechSegments(screen));
        }

          const badges = [

          return `

              </p>

              </div>

              <div class="quiz-panel" aria-label="Space Explorer Mini Quiz">
                <h2 class="quiz-heading">Space Explorer Mini Quiz</h2>
                ${quizHtml}
                ${
                  allQuizCorrect
                    ? `
                      <div class="explorer-cert-banner">
                        <div>★ Awesome job, Space Explorer! You remembered every cosmic echo!</div>
                      </div>
                    `
                    : ''
                }
              </div>

              <button
                type="button"
                class="btn-start"
                id="finishMissionBtn"
                ${allQuizCorrect ? '' : 'disabled'}
              >
                <span>${allQuizCorrect ? 'Finish Mission' : '🔒 Finish Mission'}</span>
                <span aria-hidden="true">→</span>
              </button>
              ${
                allQuizCorrect
                  ? ''
                  : `<p class="challenge-lock-note">Answer all 3 quiz questions correctly to unlock the next page!</p>`
              }
            </section>
          `;
        }

        function renderOutro(screen) {
          return `
            <section class="outro-card" aria-label="Mission Complete">
              <div class="chapter-emblem">
                ${getChapterEmblemSvg(screen.iconType)}
              </div>
              <h1 class="outro-title">Mission Complete!</h1>
              <p class="outro-text">
                Thank you for joining Emi the fox and Otty the otter on this unforgettable journey through NASA's stellar history! Every piece of hardware left behind in space tells a story of human curiosity, courage, and science that will never be forgotten.
              </p>

              <div class="team-credit-plaque">
                <span>Project proudly built by Team Suki to Sukses</span>
              </div>

              <div class="sources-panel">
                <h2 class="sources-heading">Official NASA Data Sources</h2>
                <ul class="sources-list">
                  <li>
                    <a href="https://solarsystem.nasa.gov" target="_blank" rel="noopener noreferrer">
                      <span>NASA Solar System Exploration</span>
                      <span class="source-url">(solarsystem.nasa.gov) ↗</span>
                    </a>
                  </li>
                  <li>
                    <a href="https://www.nasa.gov/mission/apollo-11" target="_blank" rel="noopener noreferrer">
                      <span>NASA Apollo 11 Mission Archive (Flag Assembly &amp; Lunar Plaque)</span>
                      <span class="source-url">(nasa.gov/mission/apollo-11) ↗</span>
                    </a>
                  </li>
                  <li>
                    <a href="https://science.nasa.gov/mission/mer-opportunity" target="_blank" rel="noopener noreferrer">
                      <span>NASA Mars Exploration Rover Opportunity Archive (Meridiani Planum)</span>
                      <span class="source-url">(science.nasa.gov/mission/mer-opportunity) ↗</span>
                    </a>
                  </li>
                </ul>
              </div>

              <div class="outro-actions-row">
                <button type="button" class="btn-start" id="readAgainBtn">
                  <span aria-hidden="true">↺</span>
                  <span>Read Again</span>
                </button>
                <button type="button" class="btn-ghost-reset" id="resetProgressBtn">
                  <span>Reset Progress</span>
                </button>
              </div>
            </section>
          `;
        }

        function bindPanelReplayHandlers(screen) {
          const replayBtn = document.getElementById('replayPageBtn');
          if (replayBtn) {
            replayBtn.addEventListener('click', () => {
              audioUnlocked = true;
              playSpeechSegments(buildScreenSpeechSegments(screen), true);
            });
          }

          const speedCycleBtn = document.getElementById('speedCycleBtn');
          if (speedCycleBtn) {
            speedCycleBtn.addEventListener('click', () => {
              audioUnlocked = true;
              const order = [1.0, 1.15, 0.85];
              const nextIdx = (order.indexOf(speechRateMultiplier) + 1) % order.length;
              speechRateMultiplier = order[nextIdx];
              saveState();
              const label = speechRateMultiplier === 0.85 ? '0.85×' : speechRateMultiplier === 1.15 ? '1.15×' : '1.0×';
              speedCycleBtn.querySelector('span').textContent = `Speed ${label}`;
              playStoryChime('Narrator', true);
            });
          }

          const sfxToggleBtn = document.getElementById('sfxToggleBtn');
          if (sfxToggleBtn) {
            sfxToggleBtn.addEventListener('click', () => {
              audioUnlocked = true;
              sfxEnabled = !sfxEnabled;
              saveState();
              sfxToggleBtn.classList.toggle('is-muted', !sfxEnabled);
              sfxToggleBtn.querySelector('span').textContent = sfxEnabled ? '🔔 SFX' : '🔕 SFX';
              if (sfxEnabled) playStoryChime('Narrator', true);
            });
          }

          const zeroGBtn = document.getElementById('zeroGHotspotBtn');
          const artStage = document.getElementById('panelArtStage');
          if (zeroGBtn && artStage) {
            zeroGBtn.addEventListener('click', () => {
              audioUnlocked = true;
              playStoryChime('Emi', true);
              const items = ['✏️', '⭐', '🚀', '✨', '🪐'];
              for (let i = 0; i < 6; i += 1) {
                const el = document.createElement('span');
                el.className = 'scene-float-item';
                el.textContent = items[i % items.length];
                el.style.left = `${14 + Math.random() * 72}%`;
                el.style.top = `${35 + Math.random() * 40}%`;
                artStage.appendChild(el);
                setTimeout(() => el.remove(), 1450);
              }
            });
          }

          const inspectRodBtn = document.getElementById('inspectRodHotspotBtn');
          if (inspectRodBtn) {
            inspectRodBtn.addEventListener('click', () => {
              audioUnlocked = true;
              playStoryChime('Flik', true);
              expandedFacts.add(currentIndex);
              saveState();
              const nasaFactBtn = document.getElementById('nasaFactBtn');
              const body = document.getElementById('nasaFactBody');
              const hint = nasaFactBtn && nasaFactBtn.querySelector('.nasa-toggle-hint');
              if (nasaFactBtn) nasaFactBtn.setAttribute('aria-expanded', 'true');
              if (body) body.classList.add('is-open');
              if (hint) hint.textContent = 'Hide Fact ▲';
              if (screen.nasaFact && hasSpeechSupport) {
                playSpeechSegments(
                  [
                    { speaker: 'Narrator', blockId: 'nasa-fact-title', containerId: 'nasa-fact', text: screen.nasaFact.title },
                    { speaker: 'Narrator', blockId: 'nasa-fact-content', containerId: 'nasa-fact', text: screen.nasaFact.content }
                  ],
                  true
                );
              }
            });
          }

          const brushDustBtn = document.getElementById('brushDustBtn');
          if (brushDustBtn) {
            brushDustBtn.addEventListener('click', () => {
              audioUnlocked = true;
              if (oppyDustCleared < 3) {
                oppyDustCleared += 1;
                saveState();
              }
              playStoryChime(oppyDustCleared >= 3 ? 'Emi' : 'Oppy', true);
              const veil = document.getElementById('sceneDustVeil');
              const powerEl = document.getElementById('oppyPowerReadout');
              if (veil) veil.style.opacity = Math.max(0, 1 - oppyDustCleared / 3).toFixed(2);
              if (powerEl) powerEl.textContent = `Solar Power: ${25 + oppyDustCleared * 25}%`;
              if (oppyDustCleared >= 3) {
                brushDustBtn.classList.add('is-done');
                brushDustBtn.innerHTML = `<span aria-hidden="true">★</span><span>Oppy's Panels Sparkle!</span>`;
                spawnStarCelebration();
              } else {
                brushDustBtn.innerHTML = `<span aria-hidden="true">🧹</span><span>Brush Red Dust (${oppyDustCleared}/3)</span>`;
              }
            });
          }

          const narratorBox = stageEl.querySelector('.narrator-box[data-tts-container="narrator"]');
          if (narratorBox && screen.narrator) {
            const replayNarrator = () => {
              audioUnlocked = true;
              playSpeechSegments(
                [{ speaker: 'Narrator', blockId: 'narrator', containerId: 'narrator', text: screen.narrator }],
                true
              );
            };
            narratorBox.addEventListener('click', replayNarrator);
            narratorBox.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                replayNarrator();
              }
            });
          }

          stageEl.querySelectorAll('.speech-bubble[data-dialogue-idx]').forEach((bubble) => {
            const dIdx = Number(bubble.getAttribute('data-dialogue-idx'));
            const line = screen.dialogue && screen.dialogue[dIdx];
            if (!line) return;
            const replayLine = () => {
              audioUnlocked = true;
              playSpeechSegments(
                [
                  {
                    speaker: line.speaker,
                    blockId: `dialogue-${dIdx}`,
                    containerId: `dialogue-${dIdx}`,
                    text: line.text
                  }
                ],
                true
              );
            };
            bubble.addEventListener('click', replayLine);
            bubble.addEventListener('keydown', (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                replayLine();
              }
            });
          });
        }

        function isExplorerChallengeComplete() {
          return EXPLORER_QUIZ.every((q) => quizAnswers[q.id] === q.correctIndex);
        }

        function canProceedFromScreen(screen) {
          if (!screen) return true;
          if (screen.type === 'explorer-challenge') {
            return isExplorerChallengeComplete();
          }
          return true;
        }

        function updateNavButtonStates() {
          const total = SCREENS.length;
          prevBtn.disabled = currentIndex === 0;
          nextBtn.disabled = currentIndex === total - 1 || !canProceedFromScreen(SCREENS[currentIndex]);
        }

        function bindExplorerChallengeHandlers() {
          stageEl.querySelectorAll('.artifact-badge-card[data-jump-page]').forEach((btn) => {
            btn.addEventListener('click', () => {
              audioUnlocked = true;
              goToPage(Number(btn.getAttribute('data-jump-page')));
            });
          });

          stageEl.querySelectorAll('.inline-listen-btn[data-quiz-listen]').forEach((btn) => {
            btn.addEventListener('click', () => {
              audioUnlocked = true;
              const qId = btn.getAttribute('data-quiz-listen');
              const qObj = EXPLORER_QUIZ.find((item) => item.id === qId);
              if (!qObj) return;
              playSpeechSegments(
                [
                  {
                    speaker: 'Narrator',
                    blockId: `quiz-${qObj.id}`,
                    containerId: `quiz-${qObj.id}`,
                    text: qObj.question
                  }
                ],
                true
              );
            });
          });

          stageEl.querySelectorAll('.quiz-opt-btn[data-quiz-id]').forEach((btn) => {
            btn.addEventListener('click', () => {
              audioUnlocked = true;
              const qId = btn.getAttribute('data-quiz-id');
              const oIdx = Number(btn.getAttribute('data-opt-idx'));
              quizAnswers[qId] = oIdx;
              saveState();

              const qObj = EXPLORER_QUIZ.find((item) => item.id === qId);
              const isCorrect = qObj && oIdx === qObj.correctIndex;
              if (isCorrect) {
                playStoryChime('Emi', true);
              }

              const allCorrect = isExplorerChallengeComplete();
              if (allCorrect && !celebrationShown) {
                celebrationShown = true;
                spawnStarCelebration();
              }

              stageEl.innerHTML = renderExplorerChallenge(SCREENS[currentIndex]);
              bindExplorerChallengeHandlers();
              updateNavButtonStates();
              renderChapterMenu();

              if (isCorrect && autoVoiceEnabled) {
                playSpeechSegments(
                  [
                    {
                      speaker: 'Emi',
                      text: allCorrect
                        ? 'Yay! You answered every question right! You are a Junior Cosmic Explorer!'
                        : 'Hooray! That is right!'
                    }
                  ],
                  true
                );
              }
            });
          });

          const finishMissionBtn = document.getElementById('finishMissionBtn');
          if (finishMissionBtn) {
            finishMissionBtn.addEventListener('click', () => {
              if (!isExplorerChallengeComplete()) return;
              audioUnlocked = true;
              goToPage(currentIndex + 1);
            });
          }
        }

        function bindOutroHandlers() {
          const readAgainBtn = document.getElementById('readAgainBtn');
          if (readAgainBtn) {
            readAgainBtn.addEventListener('click', () => {
              audioUnlocked = true;
              goToPage(0);
            });
          }

          const resetBtn = document.getElementById('resetProgressBtn');
          if (resetBtn) {
            resetBtn.addEventListener('click', () => {
              audioUnlocked = true;
              quizAnswers = {};
              expandedFacts.clear();
              visitedPages.clear();
              visitedPages.add(0);
              celebrationShown = false;
              oppyDustCleared = 0;
              try {
                window.localStorage.removeItem(STORAGE_KEY);
              } catch (_) {}
              goToPage(0);
            });
          }
        }

        function renderScreen(shouldSpeak) {
          stopSpeech();
          visitedPages.add(currentIndex);
          saveState();

          const total = SCREENS.length;
          const screen = SCREENS[currentIndex];
          const pct = Math.round(((currentIndex + 1) / total) * 100);

          progressFillEl.style.width = pct + '%';
          progressTrackEl.setAttribute('aria-valuenow', String(pct));

          headerStatusEl.innerHTML = `
            <span class="header-status-label">${screen.statusLabel}</span>
            <span class="header-sep" aria-hidden="true">·</span>
            <span class="header-status-page">Page ${currentIndex + 1} of ${total}</span>
            <span class="header-status-compact" aria-hidden="true">☰ ${currentIndex + 1}/${total}</span>
            <span class="header-caret" aria-hidden="true">▾</span>
          `;
          pageCountTextEl.textContent = `Page ${currentIndex + 1} of ${total}`;
          renderChapterMenu();

          if (screen.type === 'landing') {
            stageEl.innerHTML = renderLanding(screen);
            navControlsEl.style.display = 'none';
            const startBtn = document.getElementById('startReadingBtn');
            if (startBtn) {
              startBtn.addEventListener('click', () => {
                audioUnlocked = true;
                goToPage(1);
              });
            }
          } else if (screen.type === 'chapter-intro') {
            stageEl.innerHTML = renderChapterIntro(screen);
            navControlsEl.style.display = 'flex';
            const continueBtn = document.getElementById('chapterContinueBtn');
            if (continueBtn) {
              continueBtn.addEventListener('click', () => {
                audioUnlocked = true;
                goToPage(currentIndex + 1);
              });
            }
          } else if (screen.type === 'panel') {
            stageEl.innerHTML = renderStoryPanel(screen, currentIndex);
            navControlsEl.style.display = 'flex';
            bindPanelReplayHandlers(screen);

            const nasaFactBtn = document.getElementById('nasaFactBtn');
            if (nasaFactBtn) {
              nasaFactBtn.addEventListener('click', () => {
                audioUnlocked = true;
                if (expandedFacts.has(currentIndex)) {
                  expandedFacts.delete(currentIndex);
                } else {
                  expandedFacts.add(currentIndex);
                }
                saveState();
                const body = document.getElementById('nasaFactBody');
                const hint = nasaFactBtn.querySelector('.nasa-toggle-hint');
                const open = expandedFacts.has(currentIndex);
                nasaFactBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                if (body) body.classList.toggle('is-open', open);
                if (hint) hint.textContent = open ? 'Hide Fact ▲' : 'Tap to Explore ▼';
                if (hasSpeechSupport) {
                  if (open && autoVoiceEnabled && screen.nasaFact) {
                    playSpeechSegments([
                      {
                        speaker: 'Narrator',
                        blockId: 'nasa-fact-title',
                        containerId: 'nasa-fact',
                        text: screen.nasaFact.title
                      },
                      {
                        speaker: 'Narrator',
                        blockId: 'nasa-fact-content',
                        containerId: 'nasa-fact',
                        text: screen.nasaFact.content
                      }
                    ]);
                  } else {
                    stopSpeech();
                  }
                }
              });
            }

            const nasaFactListenBtn = document.getElementById('nasaFactListenBtn');
            if (nasaFactListenBtn && screen.nasaFact) {
              nasaFactListenBtn.addEventListener('click', () => {
                audioUnlocked = true;
                playSpeechSegments(
                  [
                    {
                      speaker: 'Narrator',
                      blockId: 'nasa-fact-title',
                      containerId: 'nasa-fact',
                      text: screen.nasaFact.title
                    },
                    {
                      speaker: 'Narrator',
                      blockId: 'nasa-fact-content',
                      containerId: 'nasa-fact',
                      text: screen.nasaFact.content
                    }
                  ],
                  true
                );
              });
            }
          } else if (screen.type === 'explorer-challenge') {
            stageEl.innerHTML = renderExplorerChallenge(screen);
            navControlsEl.style.display = 'flex';
            bindExplorerChallengeHandlers();
          } else if (screen.type === 'outro') {
            stageEl.innerHTML = renderOutro(screen);
            navControlsEl.style.display = 'flex';
            bindOutroHandlers();
          }

          stageEl.style.animation = 'none';
          void stageEl.offsetWidth;
          stageEl.style.animation = '';

          updateNavButtonStates();

          preloadAdjacentScenes(currentIndex);

          if (shouldSpeak) {
            speakScreen(screen);
          }
        }

        function renderChapterMenu() {
          const unlocked = isExplorerChallengeComplete();
          const itemsHtml = CHAPTER_MENU_ITEMS.map((item) => {
            const isActive = currentIndex >= item.min && currentIndex <= item.max;
            const isLocked = Boolean(item.requiresChallenge && !unlocked);
            return `
              <button
                type="button"
                class="chapter-menu-item ${isActive ? 'is-active' : ''}"
                role="menuitem"
                data-jump-page="${item.page}"
                ${isLocked ? 'disabled title="Complete the Explorer Challenge quiz first!"' : ''}
              >
                <span>${isLocked ? '🔒 ' : ''}${item.label}</span>
                <span class="chapter-menu-meta">${item.meta}</span>
              </button>
            `;
          }).join('');

          chapterMenuDropdownEl.innerHTML = `
            <div class="chapter-dropdown-title">Story Chapters</div>
            ${itemsHtml}
          `;
        }

        function setChapterMenuOpen(isOpen) {
          chapterMenuDropdownEl.hidden = !isOpen;
          headerStatusEl.classList.toggle('is-open', isOpen);
          headerStatusEl.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        }

        function goToPage(index) {
          if (index < 0 || index >= SCREENS.length) return;
          setChapterMenuOpen(false);
          stopSpeech();
          if (index !== currentIndex) {
            playPageTurnSound();
          }
          currentIndex = index;
          renderScreen(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        prevBtn.addEventListener('click', () => {
          audioUnlocked = true;
          goToPage(currentIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
          if (!canProceedFromScreen(SCREENS[currentIndex])) return;
          audioUnlocked = true;
          goToPage(currentIndex + 1);
        });

        brandHomeBtn.addEventListener('click', () => {
          goToPage(0);
        });

        autoVoiceBtn.addEventListener('click', () => {
          if (!hasSpeechSupport) return;
          autoVoiceEnabled = !autoVoiceEnabled;
          audioUnlocked = true;
          saveState();
          updateAutoVoiceButton();
          if (!autoVoiceEnabled) {
            stopSpeech();
          } else {
            speakScreen(SCREENS[currentIndex]);
          }
        });

        headerStatusEl.addEventListener('click', (e) => {
          e.stopPropagation();
          renderChapterMenu();
          setChapterMenuOpen(chapterMenuDropdownEl.hidden);
        });

        chapterMenuDropdownEl.addEventListener('click', (e) => {
          const item = e.target.closest('.chapter-menu-item[data-jump-page]');
          if (!item || item.disabled) return;
          audioUnlocked = true;
          goToPage(Number(item.getAttribute('data-jump-page')));
        });

        document.addEventListener('click', (e) => {
          if (!chapterMenuDropdownEl.hidden && !headerMenuWrapEl.contains(e.target)) {
            setChapterMenuOpen(false);
          }
        });

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape' && !chapterMenuDropdownEl.hidden) {
            setChapterMenuOpen(false);
            headerStatusEl.focus();
            return;
          }
          const activeTag = document.activeElement && document.activeElement.tagName;
          if (activeTag === 'INPUT' || activeTag === 'TEXTAREA') {
            return;
          }
          if (e.key === 'ArrowRight') {
            if (currentIndex < SCREENS.length - 1 && canProceedFromScreen(SCREENS[currentIndex])) {
              e.preventDefault();
              audioUnlocked = true;
              goToPage(currentIndex + 1);
            }
          } else if (e.key === 'ArrowLeft') {
            if (currentIndex > 0) {
              e.preventDefault();
              audioUnlocked = true;
              goToPage(currentIndex - 1);
            }
          }
        });

        let touchStartX = 0;
        let touchStartY = 0;

        stageEl.addEventListener(
          'touchstart',
          (e) => {
            if (!e.changedTouches || !e.changedTouches.length) return;
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
          },
          { passive: true }
        );

        stageEl.addEventListener(
          'touchend',
          (e) => {
            if (!e.changedTouches || !e.changedTouches.length) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
              audioUnlocked = true;
              if (dx < 0 && currentIndex < SCREENS.length - 1 && canProceedFromScreen(SCREENS[currentIndex])) {
                goToPage(currentIndex + 1);
              } else if (dx > 0 && currentIndex > 0) {
                goToPage(currentIndex - 1);
              }
            }
          },
          { passive: true }
        );

        window.addEventListener('beforeunload', stopSpeech);

        loadSavedState();
        updateAutoVoiceButton();
        renderScreen(false);
      })();
    </script>
  </body>
</html>
